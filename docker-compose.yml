version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: devplatform-postgres
    environment:
      POSTGRES_DB: devplatform
      POSTGRES_USER: devplatform
      POSTGRES_PASSWORD: devplatform123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devplatform"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - devplatform

  redis:
    image: redis:7-alpine
    container_name: devplatform-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - devplatform

  zipkin:
    image: openzipkin/zipkin:latest
    container_name: devplatform-zipkin
    ports:
      - "9411:9411"
    environment:
      - STORAGE_TYPE=mem
    networks:
      - devplatform

  # Prometheus for metrics collection
  prometheus:
    image: prom/prometheus:latest
    container_name: devplatform-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    networks:
      - devplatform

  # Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    container_name: devplatform-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin123
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infrastructure/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./infrastructure/grafana/datasources:/etc/grafana/provisioning/datasources
    depends_on:
      - prometheus
    networks:
      - devplatform

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  devplatform:
    driver: bridge
