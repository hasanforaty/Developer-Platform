spring:
  application:
    name: log-aggregation
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:devplatform}
    username: ${DB_USER:devplatform}
    password: ${DB_PASSWORD:devplatform123}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 15

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  task:
    execution:
      pool:
        core-size: 5
        max-size: 10
        queue-capacity: 100

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

logging:
  level:
    root: INFO
    com.devplatform: DEBUG

# Log Aggregation specific configuration
log-aggregation:
  retention:
    days: 30
  batch:
    size: 100
    timeout: 5s
  cleanup:
    cron: "0 0 2 * * *" # Run at 2 AM daily
